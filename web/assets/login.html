<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="robots" content="noindex, nofollow" />
  <title>登录 · NVR Sync</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f8cff'/%3E%3Cpath d='M18 40V24l14 8 14-8v16l-14 8z' fill='%230f1115' opacity='.85'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --border: #262c38;
      --text: #e7ebf3;
      --muted: #8b93a7;
      --accent: #4f8cff;
      --accent-strong: #6b9dff;
      --bad: #ff5f6d;
      --radius: 14px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-color: var(--bg);
      background-image:
        radial-gradient(1100px 560px at 12% -12%, rgba(79, 140, 255, 0.11), transparent 62%),
        radial-gradient(900px 480px at 108% -6%, rgba(124, 92, 255, 0.07), transparent 58%);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      padding: 30px 28px 26px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.95);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 6px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: linear-gradient(145deg, rgba(79, 140, 255, 0.24), rgba(79, 140, 255, 0.08));
      border: 1px solid rgba(79, 140, 255, 0.35);
      color: var(--accent-strong);
    }
    .brand-mark svg { width: 21px; height: 21px; }
    .brand span { color: var(--accent); }
    .subtitle { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
    .field { margin-bottom: 15px; }
    label {
      display: block;
      margin-bottom: 6px;
      color: #c7cedd;
      font-size: 12.5px;
      font-weight: 600;
    }
    input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      color: var(--text);
      background: #10131a;
      border: 1px solid #2b3241;
      border-radius: 9px;
      font: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 140, 255, 0.18);
    }
    button {
      width: 100%;
      height: 43px;
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #fff;
      background: linear-gradient(180deg, #5b95ff, #3f7bf0);
      border: 1px solid rgba(79, 140, 255, 0.55);
      border-radius: 9px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      transition: filter 0.15s, opacity 0.15s;
    }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:disabled { opacity: 0.62; cursor: default; }
    .error {
      display: none;
      margin: 0 0 14px;
      padding: 9px 11px;
      color: #ffd5d8;
      background: rgba(255, 95, 109, 0.12);
      border: 1px solid rgba(255, 95, 109, 0.38);
      border-radius: 9px;
      font-size: 13px;
    }
    .error.show { display: block; }
    .foot {
      margin: 20px 0 0;
      color: #697184;
      font-size: 11.5px;
      text-align: center;
    }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="6" width="12" height="12" rx="2.5"></rect>
          <path d="M15 10.5 21 7v10l-6-3.5"></path>
          <circle cx="9" cy="12" r="2"></circle>
        </svg>
      </span>
      <div>NVR <span>Sync</span></div>
    </div>
    <p class="subtitle">请输入账户密码以继续</p>

    <form id="login-form" novalidate>
      <p class="error" id="login-error" role="alert"></p>
      <div class="field">
        <label for="login-user">用户名</label>
        <input id="login-user" name="username" type="text" value="admin"
               autocomplete="username" autocapitalize="none" spellcheck="false" required />
      </div>
      <div class="field">
        <label for="login-password">密码</label>
        <input id="login-password" name="password" type="password"
               autocomplete="current-password" required />
      </div>
      <button id="login-submit" type="submit">
        <span class="spinner" id="login-spinner" hidden aria-hidden="true"></span>
        <span id="login-submit-label">登录</span>
      </button>
    </form>

    <p class="foot">登录保护可在设置 →「账户安全」中关闭</p>
  </main>

  <script>
    (function () {
      'use strict';

      var form = document.getElementById('login-form');
      var userInput = document.getElementById('login-user');
      var passInput = document.getElementById('login-password');
      var submitBtn = document.getElementById('login-submit');
      var submitLabel = document.getElementById('login-submit-label');
      var spinner = document.getElementById('login-spinner');
      var errorBox = document.getElementById('login-error');
      var busy = false;

      function showError(message) {
        errorBox.textContent = message;
        errorBox.classList.add('show');
      }

      function clearError() {
        errorBox.textContent = '';
        errorBox.classList.remove('show');
      }

      function setBusy(value) {
        busy = value;
        submitBtn.disabled = value;
        spinner.hidden = !value;
        submitLabel.textContent = value ? '登录中…' : '登录';
      }

      async function submit() {
        if (busy) return;
        clearError();

        var user = String(userInput.value || '').trim();
        var password = String(passInput.value || '');
        if (!user) {
          showError('请输入用户名');
          userInput.focus();
          return;
        }
        if (!password) {
          showError('请输入密码');
          passInput.focus();
          return;
        }

        setBusy(true);
        try {
          var response = await fetch('/api/login', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
            body: JSON.stringify({ user: user, password: password })
          });

          var payload = null;
          try { payload = await response.json(); } catch (err) { payload = null; }

          if (response.ok && payload && payload.ok !== false) {
            window.location.replace('/');
            return;
          }

          if (response.status === 429) {
            showError('失败次数过多，请 60 秒后再试');
          } else if (response.status === 401) {
            showError('用户名或密码错误');
          } else {
            showError((payload && payload.error) || ('登录失败（HTTP ' + response.status + '）'));
          }
        } catch (err) {
          showError('网络错误：' + (err && err.message ? err.message : String(err)));
        } finally {
          setBusy(false);
        }

        passInput.select();
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        submit();
      });

      // 已填入默认用户名时直接聚焦密码框。
      if (userInput.value) {
        passInput.focus();
      } else {
        userInput.focus();
      }
    })();
  </script>
</body>
</html>
